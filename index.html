<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy 30th Birthday My Love</title>
  <style>
    :root{
      --bg1:#0f1720;
      --bg2:#1b2735;
      --bg3:#2a3441;
      --text:#fff8f8;
      --muted:#e7dede;
      --card:rgba(255,255,255,.08);
      --line:rgba(255,255,255,.14);
      --heart:#d94a5e;
      --heart-dark:#b9374b;
      --shadow:0 18px 40px rgba(0,0,0,.28);
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      font-family: Arial, Helvetica, sans-serif;
      color:var(--text);
      overflow-x:hidden;
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.06), transparent 18%),
        radial-gradient(circle at 80% 18%, rgba(217,74,94,.10), transparent 20%),
        radial-gradient(circle at 50% 80%, rgba(255,255,255,.04), transparent 18%),
        linear-gradient(135deg,var(--bg1),var(--bg2),var(--bg3));
    }

    .floating-hearts{
      position:fixed;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:0;
    }

    .heart{
      position:absolute;
      bottom:-80px;
      width:54px;
      height:54px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:11px;
      font-weight:700;
      letter-spacing:.04em;
      animation:floatUp linear forwards;
      opacity:.95;
      filter:drop-shadow(0 8px 16px rgba(0,0,0,.22));
    }

    .heart::before,
    .heart::after{
      content:"";
      position:absolute;
      width:28px;
      height:44px;
      background:linear-gradient(180deg,var(--heart),var(--heart-dark));
      border-radius:28px 28px 0 0;
      top:6px;
      z-index:-1;
    }

    .heart::before{
      left:27px;
      transform:rotate(-45deg);
      transform-origin:0 100%;
    }

    .heart::after{
      left:0;
      transform:rotate(45deg);
      transform-origin:100% 100%;
    }

    @keyframes floatUp{
      0%{
        transform:translateY(0) scale(.85) rotate(0deg);
        opacity:0;
      }
      10%{opacity:.95}
      100%{
        transform:translateY(-120vh) scale(1.08) rotate(6deg);
        opacity:0;
      }
    }

    .wrap{
      position:relative;
      z-index:1;
      max-width:1150px;
      margin:0 auto;
      padding:32px 20px 60px;
    }

    .hero{
      text-align:center;
      padding:56px 24px 34px;
      border:1px solid var(--line);
      border-radius:30px;
      background:var(--card);
      backdrop-filter:blur(10px);
      box-shadow:var(--shadow);
    }

    .eyebrow{
      text-transform:uppercase;
      letter-spacing:.22em;
      font-size:12px;
      font-weight:700;
      color:#ffccd3;
      margin-bottom:18px;
    }

    h1{
      margin:0;
      font-size:clamp(40px, 7vw, 86px);
      line-height:.95;
      font-weight:800;
    }

    .sub{
      max-width:760px;
      margin:18px auto 0;
      color:var(--muted);
      font-size:clamp(18px, 2.4vw, 24px);
      line-height:1.5;
    }

    .gallery{
      margin-top:28px;
      display:grid;
      grid-template-columns:1.1fr .9fr .9fr;
      gap:18px;
    }

    .photo-card{
      position:relative;
      overflow:hidden;
      border-radius:26px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.05);
      min-height:280px;
      box-shadow:var(--shadow);
      transform:translateY(0);
      transition:transform .28s ease, box-shadow .28s ease;
    }

    .photo-card:hover{
      transform:translateY(-5px);
      box-shadow:0 22px 40px rgba(0,0,0,.34);
    }

    .photo-card img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .tall{min-height:560px}
    .medium{min-height:270px}
    .stack{
      display:grid;
      gap:18px;
    }

    .caption{
      position:absolute;
      left:14px;
      right:14px;
      bottom:14px;
      padding:10px 12px;
      border-radius:14px;
      background:rgba(0,0,0,.40);
      border:1px solid rgba(255,255,255,.12);
      color:#fff;
      font-size:14px;
      font-weight:700;
      text-align:left;
    }

    .footer-note{
      text-align:center;
      margin-top:24px;
      color:#f5d9dd;
      font-size:18px;
      font-weight:600;
    }

    @media (max-width: 900px){
      .gallery{
        grid-template-columns:1fr;
      }
      .tall,.medium{
        min-height:320px;
      }
    }
  </style>
</head>
<body>
  <div class="floating-hearts" id="floatingHearts"></div>

  <div class="wrap">
    <section class="hero">
      <div class="eyebrow">For Aaron</div>
      <h1>HAPPY 30TH<br>BIRTHDAY MY LOVE</h1>
      <div class="sub">
        A little page for us, for our memories, and for a love that found its way back.
      </div>
    </section>

    <section class="gallery">
      <div class="photo-card tall">
        <img src="photo5.jpg" alt="Sunset photo together">
        <div class="caption">My love.</div>
      </div>

      <div class="stack">
        <div class="photo-card medium">
          <img src="photo1.jpg" alt="Cherry blossom selfie">
          <div class="caption">Us now.</div>
        </div>
        <div class="photo-card medium">
          <img src="photo4.jpg" alt="Pokemon card">
          <div class="caption">Our little world.</div>
        </div>
      </div>

      <div class="stack">
        <div class="photo-card medium">
          <img src="photo2.jpg" alt="School and recent collage">
          <div class="caption">From kids to forever.</div>
        </div>
        <div class="photo-card medium">
          <img src="photo3.jpg" alt="Hug photo">
          <div class="caption">Always you.</div>
        </div>
      </div>
    </section>

    <div class="footer-note">A+V forever ❤️</div>
  </div>

  <script>
    const heartsContainer = document.getElementById('floatingHearts');

    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = 'A+V';

      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (7 + Math.random() * 6) + 's';
      heart.style.fontSize = (10 + Math.random() * 2) + 'px';

      heartsContainer.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 13000);
    }

    for (let i = 0; i < 12; i++) {
      setTimeout(createHeart, i * 500);
    }

    setInterval(createHeart, 900);
  </script>
</body>
</html>
